# 로컬 도메인 팩 — /cobro-recipe init 결과 (cobro-mcp)
# 수집 범위(샘플링): README.ko.md 앞 60줄, package.json, src/ 디렉터리 목록, 최근 커밋 제목 50개, git remote
# terms의 review: false = 사용자 확인 전 초안

id: cobro-mcp
project:
  name: cobro-mcp
  url: https://github.com/boonblade/cobro-mcp
lang: ko
name: Cobro (co-browse MCP)
description: 브라우저에서 요소를 골라 메모를 Send하면 코딩 에이전트 대화에 맥락과 함께 도착하는 MCP 서버·페이지 오버레이
metaphor_source: 사무실 협업 (포스트잇 메모, 메모함, 회의실 칠판, 사내 전화선, 우편 창구)
business_readers: 디자이너, 기획자, 개발자가 아닌 도구 사용자
reviewer: Cobro를 쓰는 비개발 직군 1인
domain_knowledge_examples: [여러 탭·페이지에 걸친 초안, 라운드 흐름(보냄→수정 중→완료), 새로고침/HMR 전략, 선택자·소스맵 위치 추적]

sketch:
  protagonist: pencil
  trail: dash
  doodles: [star, arrow, spiral, box]

terms:
  - { term: MCP server, plain: 에이전트와 브라우저 사이의 전달 창구, review: false }
  - { term: overlay, plain: 웹페이지 위에 덧댄 투명 작업 필름, review: false }
  - { term: draft, plain: 아직 보내지 않은 포스트잇 메모, review: false }
  - { term: batch, plain: 한 페이지에서 쓴 메모 한 묶음, review: false }
  - { term: session, plain: 한 번의 작업 회의, review: false }
  - { term: WebSocket, plain: 끊지 않고 연결해 둔 사내 전화선, review: false }
  - { term: bridge, plain: 전화선 교환대 (받은 메시지를 메모함에 반영), review: false }
  - { term: global state, plain: 회의실 칠판 하나 — 마지막에 쓴 사람 것만 남음, review: false }
  - { term: debounce, plain: 타자를 멈추고 잠깐 기다렸다가 한 번에 보내기, review: false }
  - { term: race condition, plain: 두 사람이 같은 서류를 거의 동시에 제출, review: false }
  - { term: selector, plain: 요소의 주소, review: false }
  - { term: HMR, plain: 새로고침 없이 바뀐 부분만 갈아 끼우기, review: false }
  - { term: sourcemap, plain: 번역본과 원문을 잇는 대조표, review: false }
  - { term: e2e, plain: 실제 사용자처럼 처음부터 끝까지 해 보는 시험, review: false }
  - { term: samePage, plain: "같은 문서인지 확인 (주소의 # 뒤는 무시)", review: false }
  - { term: lock, plain: 작업 중 수정 금지 표시, review: false }
  - { term: payload, plain: 보내는 소포의 내용물, review: false }
  - { term: stamp, plain: 이름표 달기, review: false }
