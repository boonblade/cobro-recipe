id: R-001
slug: cross-tab-drafts
title: 여러 탭에서 쓴 초안 지키기
domain: [overlay, core, multi-tab, draft, state]
pack: cobro-mcp
gate:
  score: 6
  signals: [S1, S2, S4, S7]
status: review
as_of:
  commit: 5cc9d99
  date: 2026-09-24
audience: [dev, business]
summary:
  plain: 한 탭에서 써 둔 메모가 다른 탭에서 메모를 고치면 사라졌다. 탭마다 자기 페이지 메모만 바꾸게 하고, 메모의 페이지 이름표도 보낸 탭이 직접 달게 해서 해결했다.
  tech: draft 메시지 처리를 전체 교체에서 페이지 단위 교체로 바꾸고(R177), 새 초안의 page를 전역 s.page가 아니라 메시지를 보낸 탭의 page로 찍으며 교체 대상 id는 유지 목록에서 제외했다(Task 69 B1).
reconstructed: true
lesson: 메모의 이름표는 보낸 탭이 단다

scenes:
  - id: s01
    type: problem
    title: 다른 탭에서 쓰면 앞 탭 메모가 사라진다
    plain: 탭 두 개에서 각각 메모를 쓰는데, 둘째 탭에서 메모를 고치자 첫째 탭에 써 둔 메모가 사라졌다.
    tech: 같은 세션에 연결된 두 오버레이(탭)가 각자 draft 메시지를 보낼 때, 한 탭의 메시지가 다른 탭이 만든 서버 초안을 지운다.
    visual:
      kind: compare-grid
      caption: 같은 세션, 서로 다른 페이지의 두 탭
      items:
        - { label: ① 탭 A 메모, state: ok, note: 저장됨 }
        - { label: ② 탭 B 메모, state: ok, note: 저장됨 }
        - { label: ③ 탭 A 메모 다시 보기, state: ng, note: 사라짐 }
    evidence:
      - { commit: fd91128, file: CHANGELOG.md, note: "Drafts made in one tab are no longer wiped when you edit a draft in another tab" }

  - id: s02
    type: observe
    title: 초안 메시지가 "전부 바꾸기"였다
    plain: 각 탭은 "내가 가진 메모 전부"를 보내고, 받는 쪽은 그것으로 메모함 전체를 갈아 끼우고 있었다. 둘째 탭은 첫째 탭 메모를 모르니 그 메모 없이 덮어쓴 셈이다.
    tech: OverlayMsg 'draft'의 계약이 "status draft인 것 전체 교체"였고, SessionCore.setDrafts(batches)는 draft가 아닌 배치만 남기고 초안을 통째로 교체했다.
    visual:
      kind: code-diff
      lang: ts
      caption: 수정 전 setDrafts — 초안은 전부 버리고 받은 것으로 교체
      snippet: |
        setDrafts(batches: Batch[]): void {
          const others = this.s.batches.filter((b) => b.status !== 'draft');
          ...
    evidence:
      - { commit: dd6596f, file: src/core/session.ts, note: "수정 전 코드는 dd6596f의 부모 34-35행" }
      - { commit: dd6596f, file: src/core/types.ts }

  - id: s03
    type: attempt
    title: "시도 1: 페이지 단위로 바꾸기"
    plain: 메모함을 통째로 바꾸지 않고, 보낸 탭의 페이지 메모만 바꾸게 했다. 탭 쪽도 자기 페이지 메모만 보내고, 받은 목록에 다른 탭 메모를 합쳐 보관하게 했다.
    tech: draft 메시지에 page(location.href)를 추가하고 setDrafts(batches, pageUrl)가 samePage인 초안만 교체하게 했다. 오버레이 flushDraft는 현재 페이지 초안만 보내고, state 수신 시 서버 순서대로 병합한다.
    visual:
      kind: code-diff
      lang: ts
      caption: 같은 페이지 초안만 교체 대상
      before: |
        const others = this.s.batches.filter((b) => b.status !== 'draft');
      after: |
        const others = this.s.batches.filter((b) => {
          if (b.status !== 'draft') return true;
          if (!pageUrl) return false;
          return !!b.page && !samePage(b.page.url, pageUrl);
        });
    evidence:
      - { commit: dd6596f, file: src/core/session.ts }
      - { commit: fd91128, file: src/overlay/index.ts }
      - { test: "test/core/session.test.ts › setDrafts replaces drafts per page when a pageUrl is given (R177)" }

  - id: s04
    type: fail
    title: 여는 순서를 바꾸면 이름표가 틀리고 메모가 둘로 는다
    plain: 리뷰에서 막혔다. 첫째 탭을 열어 두고 둘째 탭을 연 뒤 첫째 탭에서 새 메모를 쓰면, 그 메모에 둘째 탭 페이지 이름표가 붙었고 다음 저장 때 같은 메모가 두 개로 늘어났다.
    tech: 새 초안의 page를 서버 전역 s.page(마지막에 연결한 탭)로 찍어 라벨이 어긋났다. 같은 id를 다시 보내면 samePage 불일치로 others에 남는 동시에 kept에도 들어가 중복 증식했다(리뷰 Task 69 B1).
    visual:
      kind: compare-grid
      caption: 시도 1은 탭 연결 순서에 따라 결과가 갈린다
      items:
        - { label: "A 메모 → B 열기", state: ok, note: 시도 1로 해결 }
        - { label: "A 열기 → B 열기 → A 새 메모", state: ng, note: 이름표 B · 메모 2개 }
    evidence:
      - { commit: 9af6e18, note: "커밋 메시지: Task 69 B1 — 초안 page를 보낸 탭의 페이지로 찍고 교체 대상 id를 유지 목록에서 제외" }
      - { file: test/e2e/overlay.spec.ts, lines: "1281", commit: 9af6e18, note: "B1 재현 순서(순차 탭 전환)로 e2e 수정" }

  - id: s05
    type: discovery
    title: 칠판이 하나뿐이었다
    plain: 메모를 얼마나 바꾸느냐가 아니라 "이 메모가 어느 탭에서 왔나"를 모르는 게 문제였다. 서버는 회의실 칠판 하나에 마지막으로 들어온 탭 이름만 적어 두고, 모든 새 메모에 그 이름표를 붙이고 있었다.
    tech: 원인은 교체 범위가 아니라 발신 맥락의 부재였다. setDrafts가 새 초안의 page를 전역 s.page에서 가져와 멀티탭에서 연결 순서에 따라 라벨이 달라졌고, 라벨이 어긋나면 교체 대상 판정(samePage)도 함께 어긋났다.
    visual:
      kind: diagram
      type: before-after
      caption: 이름표를 누가 다는가
      spec:
        before_title: 전역 칠판(s.page)이 이름표를 단다
        before: ["탭 A 연결 → 칠판: A", "탭 B 연결 → 칠판: B", "탭 A 새 메모 → 이름표 B ✗"]
        after_title: 보낸 탭이 이름표를 단다
        after: ["탭 A 새 메모 + '나는 A 페이지'", "서버: 이름표 A ✓", "이번에 받은 id는 항상 교체 대상"]
    evidence:
      - { commit: 9af6e18, file: src/core/session.ts, lines: "57" }

  - id: s06
    type: solution
    title: 보낸 탭이 이름표를 단다
    plain: 메모를 보낼 때 탭이 자기 페이지 이름표를 함께 보내고, 서버는 새 메모에 그 이름표를 그대로 단다. 이번에 받은 메모는 이름표와 상관없이 항상 새것으로 바꿔 중복을 막았다.
    tech: draft 메시지의 page를 {url, title} 객체로 바꾸고, setDrafts(batches, page)가 처음 보는 초안을 메시지 page로 stamp한다. keptIds에 든 id는 others에서 무조건 제외한다. bridge는 page.url이 문자열일 때만 넘긴다(하위 호환).
    visual:
      kind: code-diff
      lang: ts
      caption: src/core/session.ts @ 9af6e18
      snippet: |
        const keptIds = new Set(kept.map((b) => b.id));
        const others = this.s.batches.filter((b) => {
          if (keptIds.has(b.id)) return false; // 교체 대상 id는 무조건 제외
          if (b.status !== 'draft') return true;
          if (!page) return false;
          return !!b.page && !samePage(b.page.url, page.url);
        });
        // 처음 보는 초안은 메시지의 page(보낸 탭)로 찍는다
        const stamped = prev ? prev.page : (page ?? (this.s.page ? { ... } : undefined));
    evidence:
      - { commit: 9af6e18, file: src/core/session.ts, lines: "36-58" }
      - { commit: 9af6e18, file: src/bridge.ts, lines: "37-38" }
      - { commit: 9af6e18, file: src/core/types.ts, lines: "52" }

  - id: s07
    type: edge
    title: 옛 버전 탭과 주소 비교 규칙
    plain: 옛 버전 탭이 페이지 정보 없이 보내면 예전처럼 전체를 바꾼다. 주소에서 # 뒤만 다르면 같은 페이지로 본다.
    tech: page 없는 draft 메시지는 전체 교체(하위 호환), page 없는 옛 초안은 같은 페이지로 간주한다. samePage는 origin+pathname+search만 비교하고 hash는 무시한다(R163).
    visual:
      kind: table
      columns: [상황, 동작]
      rows:
        - [페이지 정보 없는 메시지 (옛 오버레이), 전체 교체 — 기존 동작 유지]
        - [페이지 정보 없는 옛 초안, 받는 탭의 페이지로 간주]
        - ["주소의 # 뒤만 다름", 같은 페이지]
        - ["주소의 ? 뒤가 다름", 다른 페이지]
    evidence:
      - { file: src/core/page.ts, lines: "1-7", commit: d898af4 }
      - { commit: 9af6e18, file: src/bridge.ts, lines: "37" }

  - id: s08
    type: verify
    title: 탭 순서를 바꿔도 메모가 지켜진다
    plain: 두 탭을 여는 순서를 바꿔 가며 확인했고, 메모는 둘 다 남고 한 번 보내면 둘 다 전달됐다. 관련 자동 시험 49개가 모두 통과한다.
    tech: 단위(session·bridge)와 e2e로 검증했다. 2026-09-30 HEAD(d898af4)에서 test/core/session.test.ts·bridge.test.ts 49/49 통과(R177·Task 69 B1 전용 3건 포함). e2e는 이번 확인에서 실행하지 않았다.
    visual:
      kind: table
      caption: vitest 2.1.9 · d898af4 · 2026-09-30
      columns: [시험, 확인 내용, 결과]
      rows:
        - [session 단위, 페이지 단위 교체 (R177), ✅]
        - [session 단위, 새 초안은 보낸 탭 page로 · 같은 id 중복 없음 (B1), ✅]
        - [bridge 단위, 두 소켓 · 다른 페이지 · 순서가 바뀌어도 중복 없음, ✅]
        - [e2e, 두 탭 초안 유지 · 어느 탭에서 Send해도 둘 다 전달, ⏸ 이번 확인에서 미실행]
    evidence:
      - { test: "test/core/session.test.ts › setDrafts stamps a brand-new draft with the message's own page… (Task 69 B1)" }
      - { test: "test/core/bridge.test.ts › two sockets drafting on different pages keep each other's draft… (R177, Task 69 B1)" }
