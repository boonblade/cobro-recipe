<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-001 봉제선 스케치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<!-- cobro-recipe 목업: sketch 스타일. recipe.yaml(R-001) 내용을 손그림 모션으로 렌더.
     원칙: 모든 그림은 render(t) 하나로 계산 → 재생·스크롤·막대 어느 쪽으로 t를 바꿔도 같은 그림. -->
<style>
:root{
  --bg:#efe9df; --chrome:#fbf8f3; --ink:#2e2622; --muted:#7a6e64; --line:#ddd4c6;
  --accent:#b2432f; --btn:#2e2622; --btn-ink:#fbf8f3; --card:rgba(251,248,243,.94);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1815; --chrome:#24211d; --ink:#ece6dc; --muted:#a79c90; --line:#3a352f;
    --accent:#e07a62; --btn:#ece6dc; --btn-ink:#1b1815; --card:rgba(36,33,29,.94);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1815; --chrome:#24211d; --ink:#ece6dc; --muted:#a79c90; --line:#3a352f;
  --accent:#e07a62; --btn:#ece6dc; --btn-ink:#1b1815; --card:rgba(36,33,29,.94);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
.stage{position:fixed;left:0;right:0;top:0;bottom:64px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.caption{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(720px,calc(100% - 32px));
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;backdrop-filter:blur(6px);
  box-shadow:0 6px 24px rgba(40,30,20,.12)}
.caption .k{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.caption .p{font-size:16px;line-height:1.55;margin:2px 0 0}
.caption .x{font-size:13px;line-height:1.5;color:var(--muted);margin:4px 0 0}
body[data-read="plain"] .caption .x{display:none}
body[data-read="tech"] .caption .p{display:none}
.controls{position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--chrome);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 16px}
.controls button{font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.controls button.play{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);width:40px;height:40px;padding:0;font-size:15px}
.controls button.ic{width:34px;height:34px;padding:0;font-size:13px}
.controls button.spd{min-width:58px;font-variant-numeric:tabular-nums;font-weight:600}
.controls button.spd::after{content:" ▾";font-size:10px;opacity:.6}
.spdwrap{position:relative;display:inline-flex}
.menu{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);z-index:20;min-width:132px;
  background:var(--chrome);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(40,30,20,.18)}
.menu[hidden]{display:none}
.menu .mh{font-size:11px;font-weight:700;color:var(--muted);padding:4px 10px 6px;letter-spacing:.03em}
.controls .menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:8px;
  padding:8px 10px;font-variant-numeric:tabular-nums;text-align:left}
.controls .menu button:hover,.controls .menu button:focus-visible{background:var(--line);outline:none}
.controls .menu button small{font-size:11px;color:var(--muted)}
.controls .menu button[aria-checked="true"]{color:var(--accent);font-weight:700}
.controls .menu button[aria-checked="true"]::after{content:"✓"}
.controls button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.controls input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
.controls .time{font:12px ui-monospace,Menlo,monospace;color:var(--muted);min-width:78px;text-align:right}
.grp{display:inline-flex;gap:4px}
.spacer{height:100vh}
body[data-nav="scroll"] .spacer{height:900vh}
@media (max-width:640px){
  .controls{gap:8px;padding:0 10px}
  .controls .time{display:none}
  .grp.read{display:none}
  .controls button.ic{display:none}
  .controls button{padding:6px 9px}
  .caption{bottom:10px;padding:10px 12px}
  .caption .p{font-size:15px}
}
</style>
</head>
<body data-read="both" data-nav="play">

<div class="stage" id="stage">
  <canvas id="cv" aria-label="R-001 패턴 두 장을 봉제하기 — 손그림 모션 레시피"></canvas>
  <div class="caption" aria-live="polite">
    <div class="k" id="capK"></div>
    <p class="p" id="capP"></p>
    <p class="x" id="capX"></p>
  </div>
</div>
<div class="spacer" id="spacer"></div>

<div class="controls">
  <button class="play" id="play" aria-label="재생/일시정지" title="재생/일시정지 (Space)">❚❚</button>
  <button class="ic" id="prev" aria-label="이전 장면" title="이전 장면 (←)">⏮</button>
  <button class="ic" id="next" aria-label="다음 장면" title="다음 장면 (→)">⏭</button>
  <span class="spdwrap">
    <button class="spd" id="speed" aria-label="재생 속도" aria-haspopup="menu" aria-expanded="false" aria-controls="speedMenu" title="재생 속도 (− / +)">1×</button>
    <div class="menu" id="speedMenu" role="menu" aria-label="재생 속도" hidden></div>
  </span>
  <input type="range" id="seek" min="0" step="0.01" aria-label="재생 위치">
  <span class="time" id="time">0.0 / 0.0</span>
  <span class="grp nav" role="group" aria-label="진행 방식">
    <button data-nav="play" aria-pressed="true">재생</button>
    <button data-nav="scroll" aria-pressed="false">스크롤</button>
  </span>
  <span class="grp read" role="group" aria-label="설명">
    <button data-read="plain" aria-pressed="false">쉬운</button>
    <button data-read="both" aria-pressed="true">둘 다</button>
    <button data-read="tech" aria-pressed="false">기술</button>
  </span>
</div>

<script>
/* =====================================================================
 * CONFIG — 문구 · 색 · 장면 시간표 · 카메라 (이 블록만 바꾸면 다른 레시피)
 * 좌표는 모두 종이 좌표(가로 1200 × 세로 4680), 가운데 기준
 * ===================================================================== */
const PAPER = { w: 1200, h: 4680 };

// 도메인 팩 테마 (packs/<id>.yaml의 sketch 값). 미리보기: 주소 뒤에 ?pack=general
const PACK_THEMES = {
  'garment-3d': { protagonist: 'needle', doodles: ['button', 'thread', 'pin', 'cross'], trail: [18, 12] },
  'general':    { protagonist: 'pencil', doodles: ['star', 'arrow', 'spiral', 'box'],   trail: [14, 10] }
};
const PACK = (() => { try { const q = new URLSearchParams(location.search).get('pack'); if (q && PACK_THEMES[q]) return q; } catch (e) {} return 'garment-3d'; })();
const THEME = PACK_THEMES[PACK];
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];   // 재생 속도 단계
const DURATION = 36;

const COLOR = {
  paper: '#ECE6DA', grid: '#2F8C8C', desk: '#CFC4B3', vignette: '#5A4632',
  ink: '#2E2622', muted: '#7A6E64', highlight: '#F5DC5A', check: '#B2432F', warn: '#C98A2B',
  retrace: '#8A5A3B',
  front: '#D6E3EF', back: '#E4DAEE',          // 앞판 / 뒷판
  gap: '#B2432F', pairA: '#F5DC5A', pairB: '#BFE3C9', steel: '#C9CDD2'
};

const TEXT = {
  title:    { s: '패턴 두 장을 봉제하기', x: 600, y: 215, size: 96, t: 0.0 },
  subtitle: { s: 'R-001 · 봉제선이 벌어진 날의 기록', x: 600, y: 330, size: 46, t: 0.9 },
  lesson:   { s: '봉제선은 점이 아니라 선의 짝', x: 600, y: 4530, size: 78, t: 32.9 },
  sign:     { s: 'cobro-recipe · R-001 · 샘플(형식 시연용)', x: 600, y: 4605, size: 32, t: 34.0 }
};

// 장면: recipe.yaml scenes와 1:1. t = 라벨 쓰기 시작 시각, (x,y) = 라벨 중심, cy = 그림 중심 y
const SCENES = [
  { n: 1, type: '문제',   label: '봉제선이 벌어짐',     x: 420, y: 620,  cy: 850,  t: 3.0,
    plain: '앞판과 뒷판을 3D로 붙였는데 옆선에서 옷이 벌어져 틈이 보인다.',
    tech: 'Front/Back panel mesh 결합 후 side seam 구간에 vertex gap 발생.' },
  { n: 2, type: '관찰',   label: '끝점이 어긋남',       x: 780, y: 1120, cy: 1350, t: 6.6,
    plain: '가까이 보니 두 천의 끝이 4mm쯤 어긋나 있었고, 핀 개수도 달랐다.',
    tech: 'side seam endpoint 간 거리 최대 4.2mm (M). vertex 수 A 18 / B 23.' },
  { n: 3, type: '시도',   label: '끝점 억지로 붙이기',  x: 420, y: 1620, cy: 1850, t: 10.2,
    plain: '가까운 끝점끼리 억지로 붙여 봤다.',
    tech: 'endpoint 거리 기준 매칭, tolerance 5mm 이내면 B를 A 좌표로 snapping.' },
  { n: 4, type: '실패',   label: '큰 사이즈에서 또 벌어짐', x: 780, y: 2120, cy: 2360, t: 13.2,
    plain: 'M은 붙었지만 L·XL에서 다시 벌어졌고, S는 엉뚱한 끝점끼리 붙었다.',
    tech: '그레이딩 편차로 고정 tolerance 불일치. S는 인접 edge endpoint와 오매칭.' },
  { n: 5, type: '발견',   label: '점이 아니라 선의 짝!', x: 420, y: 2620, cy: 2860, t: 17.0,
    plain: '"이 선과 저 선이 박음질된다"는 짝 정보가 없어서 생긴 문제였다.',
    tech: '원인은 좌표 오차가 아니라 seam relationship 모델 부재.' },
  { n: 6, type: '해결',   label: '봉제선에 이름표',     x: 780, y: 3120, cy: 3360, t: 20.8,
    plain: '봉제선마다 이름표를 붙이고, 같은 이름표끼리 선 전체를 맞춰 박았다.',
    tech: 'seam edge ID → SeamPair. 공통 edge 기준 transform + arc-length 재샘플링 후 stitch.' },
  { n: 7, type: 'Edge',   label: '곡선 봉제선은 숙제',  x: 420, y: 3640, cy: 3870, t: 25.4,
    plain: '길이가 다른 곡선 봉제선(소매산)은 오그려 박는 여유분 처리가 따로 필요하다.',
    tech: 'arc-length 차이(ease)가 있으면 균등 재샘플링으로 해결 안 됨 → R-004.' },
  { n: 8, type: '검증',   label: '12벌 모두 통과',      x: 780, y: 4160, cy: 4340, t: 28.4,
    plain: '패턴 3종을 사이즈 4개로 붙여 봤고, 12벌 모두 벌어지지 않았다.',
    tech: '티셔츠·셔츠·원피스 × S/M/L/XL = 12 case, seam gap 0.1mm 이하.' }
];
const INTRO = { k: 'R-001 · 샘플', plain: '앞판과 뒷판을 붙였더니 옆선이 벌어졌다. 점이 아니라 "어느 선끼리 붙는지"를 정해서 해결했다.',
  tech: 'seam을 ID 기반 edge pair로 모델링, 공통 edge 기준 transform으로 사이즈 무관 정합.' };
const OUTRO_T = 30.9;

// 카메라: t(초), 바라보는 곳 x,y, 확대 z ('fit' = 종이 전체), e = 이 지점까지 가는 방식
//   ease 천천히 · whip 휙(도착 후 살짝 멈칫, 이동 중 모션 블러) · snap 확 줌인 · accel 가속
const CAMERA = [
  { t: 0.0,  x: 600, y: 250,  z: 1.35 },
  { t: 1.9,  x: 640, y: 300,  z: 1.22, e: 'ease' },
  { t: 2.9,  x: 560, y: 770,  z: 1.05, e: 'whip' },
  { t: 5.8,  x: 570, y: 780,  z: 1.15, e: 'ease' },
  { t: 6.6,  x: 620, y: 1270, z: 1.05, e: 'whip' },
  { t: 9.4,  x: 620, y: 1280, z: 1.14, e: 'ease' },
  { t: 10.2, x: 560, y: 1770, z: 1.05, e: 'whip' },
  { t: 12.4, x: 565, y: 1780, z: 1.12, e: 'ease' },
  { t: 13.2, x: 620, y: 2280, z: 1.00, e: 'whip' },
  { t: 16.2, x: 620, y: 2290, z: 1.08, e: 'ease' },
  { t: 17.0, x: 560, y: 2770, z: 1.05, e: 'whip' },
  { t: 17.6, x: 600, y: 2880, z: 1.26, e: 'snap' },
  { t: 20.0, x: 600, y: 2885, z: 1.30, e: 'ease' },
  { t: 20.8, x: 640, y: 3280, z: 1.05, e: 'whip' },
  { t: 24.6, x: 610, y: 3330, z: 1.18, e: 'ease' },
  { t: 25.4, x: 580, y: 3790, z: 1.05, e: 'whip' },
  { t: 27.6, x: 585, y: 3800, z: 1.12, e: 'ease' },
  { t: 28.4, x: 620, y: 4300, z: 1.05, e: 'whip' },
  { t: 30.4, x: 620, y: 4310, z: 1.12, e: 'ease' },
  { t: 31.2, x: 600, y: 2340, z: 'fit', e: 'accel' },
  { t: 32.5, x: 600, y: 2340, z: 'fit', e: 'ease' },
  { t: 32.8, x: 600, y: 4500, z: 1.10, e: 'snap' },
  { t: 36.0, x: 600, y: 4510, z: 1.16, e: 'ease' }
];

// 바늘(주인공) 이동: 정류장 i → i+1 (0 = 제목 밑줄, 1~8 = 각 장면 라벨 옆)
const NEEDLE_DROP = { t0: 0.9, t1: 1.28 };
const NEEDLE_HOPS = [
  [1.62, 2.9], [5.8, 6.6], [9.4, 10.2], [12.4, 13.2], [16.2, 17.0], [20.0, 20.8], [24.6, 25.4], [27.6, 28.4]
];
const STITCH_WINDOW = [23.2, 24.2];   // 해결 장면에서 바늘이 직접 봉제
const RETRACE = [31.2, 32.3];          // 지나온 길 덧칠
const CHECKS_T = 31.4;                 // 라벨 옆 체크 시작

const PENCIL = { width: 4, jitter: 1.8, step: 9, boilFps: 12, overlayAlpha: 0.45 };
const WRITE_RATE = 10;                 // 1초에 10칸
const FONT = '"Gaegu","Nanum Pen Script","Comic Sans MS",cursive';

/* =====================================================================
 * 연필 엔진
 * ===================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let BOIL = 0;

function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let SEED = 7;

function densify(pts, step){
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++){
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(x1-x0, y1-y0) / step));
    for (let k = 1; k <= n; k++) out.push([x0 + (x1-x0)*k/n, y0 + (y1-y0)*k/n]);
  }
  return out;
}
// 손그림 선: 흔들림만 다른 3벌 + 누적 길이(펜으로 긋듯 그리기용)
function pencil(pts, { closed = false, jitter = PENCIL.jitter, seed } = {}){
  const src = closed ? pts.concat([pts[0]]) : pts;
  const d = densify(src, PENCIL.step);
  const base = seed ?? (SEED += 101);
  const variants = [0,1,2].map(v => {
    const r = rng(base * 13 + v * 7919);
    let ox = 0, oy = 0;
    const out = d.map(([x,y]) => {
      ox = ox * 0.5 + (r() - 0.5) * 2 * jitter;   // 이웃 점과 섞어 연필처럼 부드럽게 흔들림
      oy = oy * 0.5 + (r() - 0.5) * 2 * jitter;
      return [x + ox, y + oy];
    });
    if (closed) out[out.length - 1] = out[0];
    return out;
  });
  const cum = [0];
  for (let i = 1; i < d.length; i++) cum.push(cum[i-1] + Math.hypot(d[i][0]-d[i-1][0], d[i][1]-d[i-1][1]));
  return { variants, cum, total: cum[cum.length-1], closed };
}
function tracePartial(pts, cum, len){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++){
    if (cum[i] <= len){ ctx.lineTo(pts[i][0], pts[i][1]); continue; }
    const f = (len - cum[i-1]) / (cum[i] - cum[i-1]);
    ctx.lineTo(pts[i-1][0] + (pts[i][0]-pts[i-1][0]) * f, pts[i-1][1] + (pts[i][1]-pts[i-1][1]) * f);
    break;
  }
}
// 진한 선 + 절반 굵기·흐린 선 겹치기. p = 그려진 비율(0~1)
function stroke(shape, p = 1, { color = COLOR.ink, width = PENCIL.width, dash = null, alpha = 1 } = {}){
  if (p <= 0) return;
  const len = shape.total * Math.min(1, p), v = BOIL % 3;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width;
  tracePartial(shape.variants[v], shape.cum, len); ctx.stroke();
  ctx.globalAlpha = alpha * PENCIL.overlayAlpha; ctx.lineWidth = width / 2;
  tracePartial(shape.variants[(v + 1) % 3], shape.cum, len); ctx.stroke();
  ctx.restore();
}
function fill(shape, color, alpha = 1){
  if (alpha <= 0) return;
  const pts = shape.variants[BOIL % 3];
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath();
  pts.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.closePath(); ctx.fill(); ctx.restore();
}

// 도형 헬퍼 (점 배열)
const rect = (x0,y0,x1,y1) => [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const circ = (cx,cy,r,n=36) => Array.from({length:n}, (_,i) => [cx + r*Math.cos(i/n*2*Math.PI - Math.PI/2), cy + r*Math.sin(i/n*2*Math.PI - Math.PI/2)]);
function bez(p0,p1,p2,p3,n=28){ return Array.from({length:n+1}, (_,i) => { const t=i/n, u=1-t;
  return [u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0], u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]; }); }
function catmull(pts, n=16){
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(0,i-1)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(pts.length-1,i+2)];
    for (let k = 0; k < n; k++){ const t = k/n, t2 = t*t, t3 = t2*t;
      out.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]); }
  }
  out.push(pts[pts.length-1]); return out;
}

// 시간 헬퍼
const clamp01 = v => Math.max(0, Math.min(1, v));
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const EASE = {
  ease:  u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2,
  whip:  u => { const c = 1.25; const v = u - 1; return 1 + (c + 1) * v*v*v + c * v*v; },   // 빠르게 가서 살짝 넘쳤다 멈칫
  snap:  u => u === 1 ? 1 : 1 - Math.pow(2, -12 * u),
  accel: u => u*u*u,
  lin:   u => u
};
// 떨어져 찌그러졌다 튕기기: 0~1 → {y 비율, 눌림}
function dropBounce(u){
  if (u < 0.6){ const k = u / 0.6; return { y: k*k, sq: 0 }; }
  const k = (u - 0.6) / 0.4; return { y: 1 - Math.sin(k * Math.PI) * 0.12 * (1 - k), sq: Math.sin(Math.min(1, k*3) * Math.PI) * 0.25 };
}

/* ---------- 글자: 왼쪽부터 1초에 10칸 ---------- */
function measure(s, size){ ctx.font = `700 ${size}px ${FONT}`; return ctx.measureText(s).width; }
function write(s, x, y, size, t0, t, { color = COLOR.ink, align = 'center', alpha = 1 } = {}){
  if (t < t0) return -1;
  const chars = [...s]; const n = Math.min(chars.length, Math.floor((t - t0) * WRITE_RATE) + 1);
  ctx.save(); ctx.font = `700 ${size}px ${FONT}`; ctx.fillStyle = color; ctx.globalAlpha = alpha;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const w = ctx.measureText(s).width; const x0 = align === 'center' ? x - w/2 : x;
  ctx.fillText(chars.slice(0, n).join(''), x0, y); ctx.restore();
  return n === chars.length ? t - (t0 + (chars.length - 1) / WRITE_RATE) : -1;   // 다 쓴 뒤 경과 시간
}

/* =====================================================================
 * 장면 도형 (한 번만 생성, 흔들림 3벌 고정)
 * ===================================================================== */
let G = null;   // 폰트 로드 후 build()
function build(){
  const g = {};
  // 라벨: 동그라미 번호 + 글자 + 형광 밑줄 위치 계산
  const LS = 58;
  g.labels = SCENES.map(s => {
    const tw = measure(s.label, LS), r = LS * 0.42, gap = 16;
    const total = r*2 + gap + tw, left = s.x - total/2;
    const cx = left + r, tx = left + r*2 + gap;
    return { s, size: LS, cx, r, tx, tw,
      circle: pencil(circ(cx, s.y, r, 30)),
      under: pencil([[tx - 4, s.y + LS*0.34], [tx + tw + 6, s.y + LS*0.30]], { jitter: 1 }),
      check: pencil([[tx + tw + 26, s.y - 2], [tx + tw + 40, s.y + 18], [tx + tw + 72, s.y - 26]], { jitter: 1.2 }),
      stop: s.x < 600 ? [cx - r - 44, s.y + 6] : [tx + tw + 50, s.y + 6] };
  });
  const tw = measure(TEXT.title.s, TEXT.title.size);
  g.titleUnder = pencil([[TEXT.title.x - tw/2, 272], [TEXT.title.x + tw/2 + 20, 268]]);
  const stop0 = [TEXT.title.x + tw/2 + 34, 262];

  // 바늘 경로(= 실 땀 선): 정류장 사이를 여백 쪽으로 휘어 지나감

  function frac(pts, di){ let L = 0, T = 0; for (let i = 1; i < pts.length; i++){ const d = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); T += d; if (i <= di) L += d; } return L / T; }
  g.pathPts = densify(dense, PENCIL.step); g.stops = stops;

  const c1 = SCENES[0].cy;

    back:  pencil([[574,c1-118],[664,c1-138],[760,c1-120],[764,c1+140],[602,c1+140]], { closed: true }),
    gap:   pencil([[560,c1-118],[574,c1-118],[602,c1+140],[548,c1+140]], { closed: true, jitter: .6 }),
    arrow: pencil([[462,c1+178],[510,c1+172],[550,c1+150]]),

  // ② 관찰: 돋보기

  g.s2 = {
    lens: pencil(circ(560, c2, 150, 44), { closed: true }),
    handle: pencil([[668,c2+106],[748,c2+186]]),
    a: pencil([[520,c2-110],[520,c2+120]]),
    b: pencil([[600,c2-78],[600,c2+120]]),
    ra: pencil(circ(520,c2-110,14,16), { closed: true, jitter: .8 }),
    rb: pencil(circ(600,c2-78,14,16), { closed: true, jitter: .8 }),

  // ③ 시도: 끝점 억지로 붙이기 (B 윗점이 A로 끌려감 — 매 프레임 계산)
  const c3 = SCENES[2].cy;
  g.s3 = { a: pencil([[500,c3-100],[500,c3+110]]), c3,

  // ④ 실패: S M L XL 미니 몸판
  const c4 = SCENES[3].cy;

  g.s4 = sizes.map(([lab, st, gp], i) => {

      gap: gp ? pencil([[x-2-gp/2,c4-h],[x+2+gp/2,c4-h],[x+2+gp/2,c4+h],[x-2-gp/2,c4+h]], { closed: true, jitter: .5 }) : null,
      mark: st === 'ok' ? pencil([[x-20,c4+118],[x-6,c4+136],[x+24,c4+96]])
          : st === 'ng' ? pencil([[x-18,c4+100],[x+18,c4+136]]) : pencil([[x,c4+96],[x,c4+124]]),
      mark2: st === 'ng' ? pencil([[x+18,c4+100],[x-18,c4+136]]) : null };
  });
  // ⑤ 발견: 선의 짝
  const c5 = SCENES[4].cy;
  g.s5 = {
    front: pencil(rect(380,c5-100,520,c5+100), { closed: true }),
    back:  pencil(rect(680,c5-100,820,c5+100), { closed: true }),
    shA: pencil([[380,c5-100],[520,c5-100]], { jitter: .8 }), shB: pencil([[680,c5-100],[820,c5-100]], { jitter: .8 }),
    sdA: pencil([[520,c5-100],[520,c5+100]], { jitter: .8 }), sdB: pencil([[680,c5-100],[680,c5+100]], { jitter: .8 }),
    arc: pencil(bez([450,c5-104],[470,c5-210],[730,c5-210],[750,c5-104])),
    link: pencil([[524,c5],[676,c5]])
  };
  // ⑥ 해결: 이름표 + 바늘이 직접 봉제
  const c6 = SCENES[5].cy;
  g.s6 = { c6,
    front: pencil(rect(360,c6-100,520,c6+100), { closed: true }),
    back:  pencil(rect(0,-100,160,100), { closed: true }),                 // 로컬 좌표, 이동은 translate
    tagF:  pencil(rect(430,c6-70,500,c6-36), { closed: true, jitter: .8 }),
    tagFs: pencil([[500,c6-53],[520,c6-60]], { jitter: .5 }),
    tagB:  pencil(rect(20,-70,90,-36), { closed: true, jitter: .8 }),
    tagBs: pencil([[0,-60],[20,-53]], { jitter: .5 }),
    stitches: Array.from({length:9}, (_,i) => pencil([[508, c6-88 + i*22],[536, c6-80 + i*22]], { jitter: .6 }))
  };
  // ⑦ Edge: 진동둘레 vs 소매산
  const c7 = SCENES[6].cy;
  g.s7 = {
    arm: pencil(bez([380,c7-70],[380,c7+40],[470,c7+70],[560,c7+70])),
    cap: pencil(bez([640,c7+70],[700,c7-110],[840,c7-110],[900,c7+70])),
    ruleA: pencil([[380,c7+112],[560,c7+112]], { jitter: .8 }),
    ruleB: pencil([[640,c7+112],[900,c7+112]], { jitter: .8 })
  };
  // ⑧ 검증: 3×4 표
  const c8 = SCENES[7].cy;
  const gx = [420, 510, 600, 690, 780], gy = [c8-60, c8, c8+60, c8+120];
  g.s8 = { gx, gy,
    lines: gx.map(x => pencil([[x,gy[0]-60],[x,gy[3]]], { jitter: .8 })).concat(gy.map(y => pencil([[gx[0]-120,y],[gx[4],y]], { jitter: .8 }))),
    checks: [] };
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++){

  const DOODLE = {
    button: (x, y) => [pencil(circ(x, y, 14 + r()*10, 18), { closed: true })],
    thread: (x, y) => [pencil([[x,y],[x+60,y+8],[x+120,y-4]])],
    cross:  (x, y) => [pencil([[x-20,y-20],[x+20,y+20]]), pencil([[x+20,y-20],[x-20,y+20]])],
    pin:    (x, y) => [pencil([[x,y],[x,y+50]]), pencil(circ(x, y-6, 7, 10), { closed: true })],
    star:   (x, y) => [pencil(Array.from({length:10}, (_,i) => { const a = i/10*2*Math.PI - Math.PI/2, rr = i % 2 ? 9 : 22; return [x + rr*Math.cos(a), y + rr*Math.sin(a)]; }), { closed: true })],
    arrow:  (x, y) => [pencil([[x-40,y+10],[x+40,y-10]]), pencil([[x+22,y-22],[x+40,y-10],[x+26,y+8]])],
    spiral: (x, y) => [pencil(Array.from({length:40}, (_,i) => { const a = i*0.45, rr = 2 + i*0.7; return [x + rr*Math.cos(a), y + rr*Math.sin(a)]; }))],
    box:    (x, y) => [pencil(rect(x-22, y-16, x+22, y+16), { closed: true })]
  };
  for (let i = 0; i < 46; i++){
    const x = -300 + r() * 1700, y = -200 + r() * 4000;
    const kind = THEME.doodles[Math.floor(r() * THEME.doodles.length)];
    g.doodles.push(...DOODLE[kind](x, y));
  }
  return g;
}

/* =====================================================================
 * 카메라
 * ===================================================================== */
let VW = 1, VH = 1, DPR = 1;
const unit = () => Math.min(VW, VH) / (VW < VH ? 1150 : 900);   // z=1 → 종이 900칸(세로 화면은 1150칸)이 화면 짧은 변에
const FOCUS_Y = 0.42;                                     // 캡션에 가리지 않게 화면 위쪽을 초점으로
const fitZ = () => Math.min(VW / (PAPER.w + 80), (VH * 0.78) / (PAPER.h + 80)) / unit();
function camera(t){
  const K = CAMERA; let i = 0;
  while (i < K.length - 2 && t >= K[i+1].t) i++;
  const a = K[i], b = K[i+1];
  const za = a.z === 'fit' ? fitZ() : a.z, zb = b.z === 'fit' ? fitZ() : b.z;
  const u = prog(t, a.t, b.t), e = EASE[b.e || 'ease'](u);
  return { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), z: lerp(za, zb, e), blur: b.e === 'whip' && u > 0.02 && u < 0.6 };
}

/* =====================================================================
 * render(t) — 모든 그림은 t 하나로 결정
 * ===================================================================== */
function needleAt(t){
  const g = G; const st = g.stops;
  if (t < NEEDLE_DROP.t0 || t >= RETRACE[0]) return null;   // 마무리에서는 바늘 퇴장
  // 떨어지기
  if (t < NEEDLE_DROP.t1 + 0.34){
    const u = prog(t, NEEDLE_DROP.t0, NEEDLE_DROP.t1 + 0.34), d = dropBounce(u);
    return { x: st[0][0], y: lerp(st[0][1] - 420, st[0][1], d.y), a: -0.9, sq: d.sq, f: 0 };
  }
  // 봉제 장면: 바늘이 봉제선을 따라 내려감
  const c6 = G.s6.c6;
  if (t >= STITCH_WINDOW[0] && t < STITCH_WINDOW[1] + 0.4){
    if (t < STITCH_WINDOW[1]){ const u = prog(t, ...STITCH_WINDOW);
      return { x: 522 + Math.sin(u * 9 * Math.PI * 2) * 14, y: lerp(c6 - 90, c6 + 96, u), a: -1.3, sq: 0, f: g.stopFrac[6] }; }
    const u = EASE.ease(prog(t, STITCH_WINDOW[1], STITCH_WINDOW[1] + 0.4));
    return { x: lerp(522, st[6][0], u), y: lerp(c6 + 96, st[6][1], u), a: -0.9, sq: 0, f: g.stopFrac[6] };
  }
  let f = 0;
  for (let i = 0; i < NEEDLE_HOPS.length; i++){
    const [h0, h1] = NEEDLE_HOPS[i];
    if (t >= h1) f = g.stopFrac[i+1];
    else if (t >= h0){ f = lerp(g.stopFrac[i], g.stopFrac[i+1], EASE.ease(prog(t, h0, h1))); break; }
    else break;
  }
  const p = pointAt(f), q = pointAt(Math.max(0, f - 0.004));
  const bob = Math.sin(t * 3) * 3;
  return { x: p[0], y: p[1] + bob, a: Math.atan2(p[1] - q[1], p[0] - q[0]) || -0.9, sq: 0, f };
}
function pointAt(f){
  const s = G.path, L = s.total * f, pts = G.pathPts, cum = s.cum;
  let i = 1; while (i < cum.length - 1 && cum[i] < L) i++;
  const k = (L - cum[i-1]) / ((cum[i] - cum[i-1]) || 1);
  return [lerp(pts[i-1][0], pts[i][0], k), lerp(pts[i-1][1], pts[i][1], k)];
}
function drawProtagonist(n){ (THEME.protagonist === 'pencil' ? drawPencil : drawNeedle)(n); }
function drawPencil(n){
  ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(n.a); ctx.scale(1 + n.sq, 1 - n.sq);
  ctx.lineJoin = 'round'; ctx.strokeStyle = COLOR.ink; ctx.lineWidth = 2.5;
  const poly = (pts, fillC) => { ctx.beginPath(); pts.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.closePath(); ctx.fillStyle = fillC; ctx.fill(); ctx.stroke(); };
  poly([[0,0],[-22,-8],[-22,8]], '#EAD6B0');                 // 깎은 나무
  poly([[0,0],[-8,-3],[-8,3]], COLOR.ink);                    // 연필심
  poly([[-22,-8],[-84,-8],[-84,8],[-22,8]], '#E8B84A');        // 몸통
  poly([[-84,-8],[-94,-8],[-94,8],[-84,8]], '#B9B2A6');        // 쇠테
  poly([[-94,-8],[-106,-7],[-108,0],[-106,7],[-94,8]], '#E59A8C');  // 지우개
  ctx.restore();
}
function drawNeedle(n){
  ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(n.a); ctx.scale(1 + n.sq, 1 - n.sq);
  ctx.lineCap = 'round';
  ctx.strokeStyle = COLOR.ink; ctx.lineWidth = 3;
  ctx.fillStyle = COLOR.steel;
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-58, -5); ctx.quadraticCurveTo(-70, 0, -58, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-56, 0, 6, 2.2, 0, 0, Math.PI*2); ctx.fillStyle = COLOR.paper; ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
function label(L, t){
  const s = L.s, t0 = s.t;
  if (t < t0) return;
  ctx.save(); ctx.font = `700 28px ${FONT}`; ctx.fillStyle = COLOR.muted; ctx.globalAlpha = clamp01((t - t0) * 4);
  ctx.textBaseline = 'middle'; ctx.fillText(`${String(s.n).padStart(2,'0')} ${s.type}`, L.cx - L.r, s.y - L.size * 0.95); ctx.restore();
  stroke(L.circle, prog(t, t0, t0 + 0.3), { width: 3 });
  write(String(s.n), L.cx, s.y + 2, L.size * 0.55, t0 + 0.1, t);
  const done = [...s.label].length / WRITE_RATE + 0.25;
  if (t > t0 + done) stroke(L.under, prog(t, t0 + done, t0 + done + 0.35), { color: COLOR.highlight, width: L.size * 0.32, alpha: 0.75 });
  write(s.label, L.tx, s.y, L.size, t0 + 0.25, t, { align: 'left' });
}

function render(t){
  const cam = camera(t);
  const s = unit() * cam.z;
  cv.style.filter = (cam.blur && !REDUCED) ? 'blur(1.4px)' : 'none';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COLOR.desk; ctx.fillRect(0, 0, VW, VH);

  // 배경 낙서 층 (패럴랙스)
  ctx.save(); ctx.translate(VW/2, VH*FOCUS_Y); ctx.scale(s * 0.72, s * 0.72); ctx.translate(-cam.x * 0.82, -cam.y * 0.82);
  G.doodles.forEach(d => stroke(d, 1, { color: '#6d5a48', width: 3, alpha: 0.22 }));
  ctx.restore();

  // 종이 좌표계
  ctx.save(); ctx.translate(VW/2, VH*FOCUS_Y); ctx.scale(s, s); ctx.translate(-cam.x, -cam.y);
  ctx.save(); ctx.shadowColor = 'rgba(60,40,20,.25)'; ctx.shadowBlur = 30; ctx.fillStyle = COLOR.paper;
  ctx.fillRect(0, 0, PAPER.w, PAPER.h); ctx.restore();
  // 모눈: 40칸 아주 옅게, 200칸마다 조금 진하게
  ctx.save(); ctx.strokeStyle = COLOR.grid;
  for (const [stepG, a, w] of [[40, 0.10, 1], [200, 0.22, 1.5]]){
    ctx.globalAlpha = a; ctx.lineWidth = w; ctx.beginPath();
    for (let x = 0; x <= PAPER.w; x += stepG){ ctx.moveTo(x, 0); ctx.lineTo(x, PAPER.h); }
    for (let y = 0; y <= PAPER.h; y += stepG){ ctx.moveTo(0, y); ctx.lineTo(PAPER.w, y); }
    ctx.stroke();
  }
  ctx.restore();

  drawScenes(t);
  ctx.restore();

  // 가장자리 갈색 비네트
  const g = ctx.createRadialGradient(VW/2, VH/2, Math.min(VW,VH) * 0.35, VW/2, VH/2, Math.hypot(VW,VH) * 0.62);
  g.addColorStop(0, 'rgba(90,70,50,0)'); g.addColorStop(1, 'rgba(90,70,50,.38)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}

function drawScenes(t){
  const T = TEXT;
  // 제목
  write(T.title.s, T.title.x, T.title.y, T.title.size, T.title.t, t);
  stroke(G.titleUnder, prog(t, 1.1, 1.5), { width: 3 });
  write(T.subtitle.s, T.subtitle.x, T.subtitle.y, T.subtitle.size, T.subtitle.t, t, { color: COLOR.muted });

  // 실 땀 경로 (바늘이 지나간 만큼)
  const n = needleAt(t);
  const reached = t >= RETRACE[0] ? 1 : n ? n.f : 0;
  stroke(G.path, reached, { dash: THEME.trail, width: 3, color: COLOR.ink, alpha: .8 });
  if (t > RETRACE[0]) stroke(G.path, EASE.ease(prog(t, ...RETRACE)), { dash: THEME.trail, width: 5, color: COLOR.retrace });

  G.labels.forEach(L => label(L, t));

  // ① 문제
  { const S = G.s1, t0 = SCENES[0].t + 0.2;
    fill(S.front, COLOR.front, prog(t, t0 + 0.5, t0 + 0.9)); fill(S.back, COLOR.back, prog(t, t0 + 0.7, t0 + 1.1));
    stroke(S.front, prog(t, t0, t0 + 0.6)); stroke(S.back, prog(t, t0 + 0.25, t0 + 0.85));
    if (t > t0 + 1.0){ const pulse = t < t0 + 2.4 ? 0.55 + 0.45 * Math.sin((t - t0) * 10) : 1; fill(S.gap, COLOR.gap, prog(t, t0 + 1.0, t0 + 1.3) * pulse); }
    const cy = SCENES[0].cy;
    write('앞판', 460, cy + 20, 40, t0 + 0.9, t); write('뒷판', 680, cy + 20, 40, t0 + 1.0, t);
    stroke(S.arrow, prog(t, t0 + 1.4, t0 + 1.7), { color: COLOR.check, width: 3 });
    stroke(S.head, prog(t, t0 + 1.65, t0 + 1.8), { color: COLOR.check, width: 3 });
    write('틈!', 424, cy + 182, 44, t0 + 1.7, t, { color: COLOR.check }); }

  // ② 관찰
  { const S = G.s2, t0 = SCENES[1].t + 0.2, cy = SCENES[1].cy;
    stroke(S.lens, prog(t, t0, t0 + 0.7)); stroke(S.handle, prog(t, t0 + 0.6, t0 + 0.8), { width: 10 });
    stroke(S.a, prog(t, t0 + 0.8, t0 + 1.2), { color: '#4f6f95' }); stroke(S.b, prog(t, t0 + 1.0, t0 + 1.4), { color: '#7a5ea3' });
    S.dotsA.forEach((d, i) => { if (t > t0 + 1.2 + i * 0.06) dot(d, '#4f6f95'); });
    S.dotsB.forEach((d, i) => { if (t > t0 + 1.3 + i * 0.05) dot(d, '#7a5ea3'); });
    stroke(S.ra, prog(t, t0 + 1.8, t0 + 2.0), { color: COLOR.check, width: 3 }); stroke(S.rb, prog(t, t0 + 1.9, t0 + 2.1), { color: COLOR.check, width: 3 });
    stroke(S.dim, prog(t, t0 + 2.1, t0 + 2.3), { color: COLOR.check, width: 3 });
    write('4mm 어긋남', 660, cy - 94, 40, t0 + 2.2, t, { color: COLOR.check, align: 'left' });
    write('핀 개수도 달라', 560, cy + 200, 34, t0 + 2.6, t, { color: COLOR.muted }); }

  // ③ 시도
  { const S = G.s3, t0 = SCENES[2].t + 0.2, c = S.c3;
    stroke(S.a, prog(t, t0, t0 + 0.4));
    const u = EASE.whip(prog(t, t0 + 1.1, t0 + 1.7));
    const top = [lerp(600, 500, u), lerp(c - 66, c - 100, u)];
    stroke(pencil([top, [600, c + 110]], { seed: 3301 }), prog(t, t0 + 0.2, t0 + 0.6));
    if (t > t0 + 0.5){ dot([500, c - 100], COLOR.ink, 7); dot(top, COLOR.ink, 7); }
    stroke(S.arrow, prog(t, t0 + 0.7, t0 + 1.0), { color: COLOR.check, width: 3 });
    write('꾹!', 452, c - 150, 46, t0 + 0.9, t, { color: COLOR.check });
    write('일단 M은 붙었다', 780, c + 20, 38, t0 + 1.9, t, { color: COLOR.muted }); }

  // ④ 실패
  { const t0 = SCENES[3].t + 0.2;
    G.s4.forEach((m, i) => {
      const a = t0 + i * 0.35;
      write(m.lab, m.x, m.y - 104, 40, a, t);
      fill(m.l, COLOR.front, prog(t, a + .2, a + .4)); fill(m.r, COLOR.back, prog(t, a + .25, a + .45));
      stroke(m.l, prog(t, a, a + .3), { width: 3 }); stroke(m.r, prog(t, a + .1, a + .4), { width: 3 });
      const b = t0 + 1.6 + i * 0.25;
      if (m.gap) fill(m.gap, COLOR.gap, prog(t, b, b + .2));
      const col = m.st === 'ok' ? COLOR.ink : m.st === 'ng' ? COLOR.check : COLOR.warn;
      stroke(m.mark, prog(t, b, b + .2), { color: col, width: 4 });
      if (m.mark2) stroke(m.mark2, prog(t, b + .15, b + .3), { color: col, width: 4 });
      if (m.st === 'wrong' && t > b) dot([m.x, m.y + 140], COLOR.warn, 4);
    });
    write('엉뚱한 짝', 352, SCENES[3].cy + 112, 28, t0 + 2.6, t, { color: COLOR.warn, align: 'left' }); }

  // ⑤ 발견
  { const S = G.s5, t0 = SCENES[4].t + 0.3, cy = SCENES[4].cy;
    fill(S.front, COLOR.front, prog(t, t0 + .4, t0 + .7)); fill(S.back, COLOR.back, prog(t, t0 + .5, t0 + .8));
    stroke(S.front, prog(t, t0, t0 + .5)); stroke(S.back, prog(t, t0 + .2, t0 + .7));
    stroke(S.shA, prog(t, t0 + 1.0, t0 + 1.2), { color: COLOR.pairA, width: 14, alpha: .9 });
    stroke(S.shB, prog(t, t0 + 1.1, t0 + 1.3), { color: COLOR.pairA, width: 14, alpha: .9 });
    stroke(S.sdA, prog(t, t0 + 1.3, t0 + 1.5), { color: COLOR.pairB, width: 14, alpha: .95 });
    stroke(S.sdB, prog(t, t0 + 1.4, t0 + 1.6), { color: COLOR.pairB, width: 14, alpha: .95 });
    stroke(S.arc, prog(t, t0 + 1.7, t0 + 2.1), { dash: [12, 10], width: 3 });
    stroke(S.link, prog(t, t0 + 2.0, t0 + 2.3), { dash: [12, 10], width: 3 });
    write('어깨 ↔ 어깨', 600, cy - 150, 34, t0 + 2.0, t);
    write('옆선 ↔ 옆선', 600, cy - 26, 32, t0 + 2.3, t);
    write('점 ✗  →  선의 짝 ✓', 600, cy + 160, 50, t0 + 2.7, t, { color: COLOR.check }); }

  // ⑥ 해결
  { const S = G.s6, t0 = SCENES[5].t + 0.2, c = S.c6;
    fill(S.front, COLOR.front, prog(t, t0 + .4, t0 + .7)); stroke(S.front, prog(t, t0, t0 + .5));
    const slide = EASE.whip(prog(t, t0 + 1.6, t0 + 2.4));
    ctx.save(); ctx.translate(lerp(740, 524, slide), c);
    fill(S.back, COLOR.back, prog(t, t0 + .5, t0 + .8)); stroke(S.back, prog(t, t0 + .2, t0 + .7));
    stroke(S.tagB, prog(t, t0 + 1.2, t0 + 1.4), { width: 3 }); stroke(S.tagBs, prog(t, t0 + 1.35, t0 + 1.45), { width: 2 });
    write('옆선', 55, -53, 26, t0 + 1.3, t);
    ctx.restore();
    stroke(S.tagF, prog(t, t0 + 1.0, t0 + 1.2), { width: 3 }); stroke(S.tagFs, prog(t, t0 + 1.15, t0 + 1.25), { width: 2 });
    write('옆선', 465, c - 53, 26, t0 + 1.1, t);
    const sp = prog(t, ...STITCH_WINDOW);
    S.stitches.forEach((st, i) => stroke(st, clamp01(sp * S.stitches.length - i), { color: COLOR.check, width: 3 }));
    write('같은 이름표끼리 박음질', 600, c + 150, 36, t0 + 3.1, t); }

  // ⑦ Edge
  { const S = G.s7, t0 = SCENES[6].t + 0.2, c = SCENES[6].cy;
    stroke(S.arm, prog(t, t0, t0 + .5)); stroke(S.cap, prog(t, t0 + .3, t0 + .9));
    write('몸판 진동', 300, c - 60, 30, t0 + .5, t, { color: COLOR.muted }); write('소매산', 770, c + 10, 30, t0 + .8, t, { color: COLOR.muted });
    stroke(S.ruleA, prog(t, t0 + 1.0, t0 + 1.2), { width: 3 }); stroke(S.ruleB, prog(t, t0 + 1.1, t0 + 1.4), { width: 3 });
    write('짧음', 470, c + 142, 30, t0 + 1.2, t); write('김', 770, c + 142, 30, t0 + 1.3, t);
    write('?', 1000, c - 30, 120, t0 + 1.4, t, { color: COLOR.warn });
    write('여유분(오그림) 처리 → R-004', 640, c + 180, 30, t0 + 1.8, t, { color: COLOR.warn }); }

  // ⑧ 검증
  { const S = G.s8, t0 = SCENES[7].t + 0.2;
    S.lines.forEach((l, i) => stroke(l, prog(t, t0 + i * 0.05, t0 + i * 0.05 + .3), { width: 2.5 }));
    ['S','M','L','XL'].forEach((z, i) => write(z, (S.gx[i] + S.gx[i+1]) / 2, S.gy[0] - 30, 32, t0 + .4 + i * .05, t));
    ['티셔츠','셔츠','원피스'].forEach((z, i) => write(z, S.gx[0] - 60, (S.gy[i] + S.gy[i+1]) / 2, 30, t0 + .5 + i * .05, t));
    S.checks.forEach((c, i) => stroke(c, prog(t, t0 + .8 + i * .1, t0 + .9 + i * .1), { width: 4 }));
    write('12 / 12', 960, S.gy[1] + 30, 64, t0 + 2.1, t, { color: COLOR.check }); }

  // 마무리: 라벨 옆 체크(⑦은 물음표)
  G.labels.forEach((L, i) => {
    const a = CHECKS_T + i * 0.1;
    if (L.s.n === 7){ if (t > a) write('?', L.tx + L.tw + 46, L.s.y, 64, a, t, { color: COLOR.warn }); }
    else stroke(L.check, prog(t, a, a + .18), { color: COLOR.check, width: 5 });
  });
  write(TEXT.lesson.s, TEXT.lesson.x, TEXT.lesson.y, TEXT.lesson.size, TEXT.lesson.t, t);
  write(TEXT.sign.s, TEXT.sign.x, TEXT.sign.y, TEXT.sign.size, TEXT.sign.t, t, { color: COLOR.muted });

  if (n) drawProtagonist(n);
}
function dot([x, y], color, r = 5){ ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.restore(); }

/* =====================================================================
 * 재생 · 막대 · 스크롤 · 캡션
 * ===================================================================== */
const $ = id => document.getElementById(id);
const seek = $('seek'), playBtn = $('play'), timeEl = $('time');
seek.max = DURATION;
let T = 0, playing = !REDUCED, last = performance.now(), nav = 'play', capIdx = -2, speed = 1;
const speedBtn = $('speed'), speedMenu = $('speedMenu');
const SPEED_KEY = 'cobro-recipe:speed';
const SPEED_HINT = { 0.5: '느리게', 1: '보통', 2: '빠르게' };
speedMenu.innerHTML = '<div class="mh">재생 속도</div>' + SPEEDS.map(v =>
  `<button type="button" role="menuitemradio" aria-checked="false" data-v="${v}"><span>${v}×</span>${SPEED_HINT[v] ? `<small>${SPEED_HINT[v]}</small>` : ''}</button>`).join('');
const speedItems = [...speedMenu.querySelectorAll('button')];
function setSpeed(v){
  speed = v; speedBtn.textContent = `${v}×`;
  speedItems.forEach(b => b.setAttribute('aria-checked', String(+b.dataset.v === v)));
  try { localStorage.setItem(SPEED_KEY, String(v)); } catch (e) {}
}
function stepSpeed(dir){ const i = SPEEDS.indexOf(speed); setSpeed(SPEEDS[Math.max(0, Math.min(SPEEDS.length - 1, i + dir))]); }
// 속도 드롭다운: 클릭하면 위로 펼쳐지는 목록에서 선택
function openSpeedMenu(){
  speedMenu.hidden = false; speedBtn.setAttribute('aria-expanded', 'true');
  (speedItems.find(b => b.getAttribute('aria-checked') === 'true') || speedItems[0]).focus();
}
function closeSpeedMenu(refocus){
  if (speedMenu.hidden) return;
  speedMenu.hidden = true; speedBtn.setAttribute('aria-expanded', 'false');
  if (refocus) speedBtn.focus();
}
speedBtn.onclick = () => speedMenu.hidden ? openSpeedMenu() : closeSpeedMenu();
speedMenu.onclick = e => { const b = e.target.closest('button[data-v]'); if (b){ setSpeed(+b.dataset.v); closeSpeedMenu(true); } };
speedMenu.onkeydown = e => {
  const i = speedItems.indexOf(document.activeElement), n = speedItems.length;
  if (e.key === 'ArrowDown') speedItems[(i + 1) % n].focus();
  else if (e.key === 'ArrowUp') speedItems[(i - 1 + n) % n].focus();
  else if (e.key === 'Home') speedItems[0].focus();
  else if (e.key === 'End') speedItems[n - 1].focus();
  else if (e.key === 'Escape' || e.key === 'Tab') { closeSpeedMenu(e.key === 'Escape'); if (e.key === 'Tab') return; }
  else return;
  e.preventDefault();
};
document.addEventListener('pointerdown', e => { if (!e.target.closest('.spdwrap')) closeSpeedMenu(); });
setSpeed(1);
try { const v = parseFloat(localStorage.getItem(SPEED_KEY)); if (SPEEDS.includes(v)) setSpeed(v); } catch (e) {}

// 장면 이동: 각 장면은 바늘/연필이 출발하는 순간부터
const MARKS = [0].concat(SCENES.map((s, i) => NEEDLE_HOPS[i][0]), [OUTRO_T]);
function jump(dir){
  const target = dir > 0 ? MARKS.find(m => m > T + 0.05) : [...MARKS].reverse().find(m => m < T - 0.6);
  T = target ?? (dir > 0 ? MARKS[MARKS.length - 1] : 0);
  if (nav === 'scroll') syncScrollFromT();
}
$('prev').onclick = () => jump(-1);
$('next').onclick = () => jump(1);

function caption(t){
  let idx = -1; SCENES.forEach((s, i) => { if (t >= NEEDLE_HOPS[i][0]) idx = i; });   // 장면 = 주인공이 출발하는 순간부터
  if (t >= OUTRO_T) idx = 99;
  if (idx === capIdx) return; capIdx = idx;
  const c = idx === -1 || idx === 99 ? { k: idx === 99 ? '정리 · R-001' : INTRO.k, plain: INTRO.plain, tech: INTRO.tech }
    : { k: `${String(SCENES[idx].n).padStart(2,'0')} ${SCENES[idx].type} · ${SCENES[idx].label}`, plain: SCENES[idx].plain, tech: SCENES[idx].tech };
  $('capK').textContent = c.k; $('capP').textContent = c.plain; $('capX').textContent = c.tech;
}
function setPlaying(p){ playing = p; playBtn.textContent = p ? '❚❚' : '▶'; }
playBtn.onclick = () => { if (nav === 'scroll') setNav('play'); setPlaying(!playing); };
seek.oninput = () => { T = +seek.value; if (nav === 'scroll') syncScrollFromT(); };
seek.onpointerdown = () => setPlaying(false);
addEventListener('keydown', e => {
  if (!speedMenu.hidden) return;   // 속도 메뉴가 열려 있으면 메뉴가 키를 처리
  if (e.target !== document.body && e.target.tagName !== 'BUTTON') return;
  if (e.code === 'Space'){ if (e.target === document.body){ e.preventDefault(); playBtn.click(); } }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); jump(1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); jump(-1); }
  else if (e.key === '+' || e.key === '='){ stepSpeed(1); }
  else if (e.key === '-' || e.key === '_'){ stepSpeed(-1); }
});

function setNav(m){
  nav = m; document.body.dataset.nav = m;
  document.querySelectorAll('.controls button[data-nav]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.nav === m)));
  if (m === 'scroll'){ setPlaying(false); syncScrollFromT(); } else scrollTo(0, 0);
}
function maxScroll(){ return Math.max(1, document.documentElement.scrollHeight - innerHeight); }
function syncScrollFromT(){ scrollTo(0, T / DURATION * maxScroll()); }
addEventListener('scroll', () => { if (nav === 'scroll') T = clamp01(scrollY / maxScroll()) * DURATION; }, { passive: true });
document.querySelectorAll('.controls button[data-nav]').forEach(b => b.onclick = () => setNav(b.dataset.nav));
document.querySelectorAll('.controls button[data-read]').forEach(b => b.onclick = () => {
  document.body.dataset.read = b.dataset.read;
  document.querySelectorAll('.controls button[data-read]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});

function resize(){
  const r = $('stage').getBoundingClientRect(); VW = r.width; VH = r.height; DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
}
addEventListener('resize', resize);

function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && nav === 'play'){ T += dt * speed; if (T >= DURATION) T = 0; }
  BOIL = REDUCED ? 0 : Math.floor(now / 1000 * PENCIL.boilFps);
  render(T); caption(T);
  seek.value = T; timeEl.textContent = `${T.toFixed(1)} / ${DURATION.toFixed(1)}`;
  requestAnimationFrame(frame);
}

// 결정적 렌더 확인용 훅: window.renderAt(t)
window.renderAt = t => { T = t; setPlaying(false); render(t); caption(t); };

(async function start(){
  resize();
  try { await Promise.race([document.fonts.load(`700 40px Gaegu`), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  G = build(); setPlaying(playing);
  if (REDUCED) T = OUTRO_T + 1.5;
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
