# cobro-recipe 레시피 양식
# 저장 위치: <프로젝트>/recipes/<id>-<slug>/recipe.yaml
# 규칙: references/recipe-schema.md, references/scene-types.md, references/plain-language-guide.md
# YAML: '#', '? ', ': ', [ ] { } , 가 든 문자열은 큰따옴표로 감싼다. 여러 줄은 | 를 쓴다.

id: R-000
slug: short-kebab-title
title: ~하기
domain: []
pack: general       # packs/<id>.yaml — 생략 시 general (프로젝트에 recipes/pack.yaml이 있으면 그것)
lang: ko            # ko | en — 생략 시 팩 lang
# plain_style: field  # clear(명료형, 기본) | field(현장형) — 생략 시 팩 plain_style
gate:
  score: 0          # 4 이상
  signals: []       # S1 ~ S7
status: draft       # draft | review | published | sample
as_of:
  commit: 0000000
  date: 2026-01-01
audience: [dev, business]   # dev | business | ops | exec
summary:
  plain:
  tech:
reconstructed: false
lesson:             # 선택 — 마지막에 크게 써지는 한 줄 교훈 (없으면 제목)

scenes:
  - id: s01
    type: problem
    title:
    plain:
    tech:
    visual: { kind: image, src: assets/s01.png, alt: }
    evidence: [{ commit: 0000000 }]

  - id: s02
    type: observe
    title:
    plain:
    tech:
    visual: { kind: svg, src: assets/s02.svg }
    evidence: [{ file: , lines: }]

  - id: s03
    type: attempt
    title:
    plain:
    tech:
    visual: { kind: code-diff, lang: ts, before: "", after: "" }
    evidence: [{ commit: 0000000 }]

  - id: s04
    type: fail
    title:
    plain:
    tech:
    visual:
      kind: compare-grid
      items:
        - { label: , state: ok }
        - { label: , state: ng }
    evidence: [{ test: }]

  - id: s05
    type: discovery
    title:
    plain:
    tech:
    visual: { kind: svg, src: assets/s05.svg }
    evidence: [{ commit: 0000000 }]

  - id: s06
    type: solution
    title:
    plain:
    tech:
    visual: { kind: code-diff, lang: ts, snippet: "" }
    evidence: [{ commit: 0000000, file: , lines: }]

  - id: s07
    type: edge
    title:
    plain:
    tech:
    visual: { kind: table, columns: [], rows: [] }
    evidence: [{ test: }]

  - id: s08
    type: verify
    title:
    plain:
    tech:
    visual: { kind: table, columns: [], rows: [] }
    evidence: [{ test: }]

related: []

search:             # 선택 — 지식 검색용
  symptoms: []      # 현업이 말하는 증상
  errors: []        # 실제 에러 문구
  keywords: []
