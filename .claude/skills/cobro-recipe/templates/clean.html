<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE_TEXT}}</title>
<!-- cobro-recipe clean 템플릿 — scripts/render.py가 채운다. 외부 리소스 없음. -->
<style>
:root{
  --bg:#faf8f5; --surface:#ffffff; --ink:#1f1d1a; --muted:#6b665e; --line:#e4dfd7;
  --accent:#b4532a; --accent-soft:#f6e6dc;
  --ok:#2f7d4f; --ok-soft:#e3f1e8; --warn:#a86a00; --warn-soft:#fbefd6; --ng:#c0392b; --ng-soft:#f9e1de;
  --a:#5b7fa6; --b:#8a6fb0; --code-bg:#f3f0eb; --radius:12px;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161513; --surface:#1f1e1b; --ink:#ece8e1; --muted:#a39d93; --line:#34312c;
    --accent:#e0875d; --accent-soft:#3a2a20;
    --ok:#6cc08f; --ok-soft:#1d3226; --warn:#e3b04b; --warn-soft:#3a2f17; --ng:#ef7a6c; --ng-soft:#3c211d;
    --a:#86a8cf; --b:#b39ad6; --code-bg:#262420;
  }
}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#1f1e1b; --ink:#ece8e1; --muted:#a39d93; --line:#34312c;
  --accent:#e0875d; --accent-soft:#3a2a20;
  --ok:#6cc08f; --ok-soft:#1d3226; --warn:#e3b04b; --warn-soft:#3a2f17; --ng:#ef7a6c; --ng-soft:#3c211d;
  --a:#86a8cf; --b:#b39ad6; --code-bg:#262420;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.65;font-size:17px}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.hero{padding:48px 0 24px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.badge{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.badge.hl{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:600}
h1{font-size:clamp(28px,5vw,40px);line-height:1.25;margin:0 0 16px}
.summary .plain{font-size:19px;margin:0 0 8px}
.summary .tech{color:var(--muted);font-size:15px;margin:0}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.rail{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.rail a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:13px;padding:5px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.rail a.on{color:var(--ink);background:var(--surface);border-color:var(--line);font-weight:600}
.rail .lbl{display:none}
.rail a.on .lbl{display:inline}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.mode button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--accent);color:#fff}
.scrolly{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;padding:24px 0 80px}
.stage{position:sticky;top:72px;height:calc(100vh - 96px);display:flex;align-items:center}
.stage .slot{position:relative;width:100%;height:100%;max-height:560px}
.stage .fig{position:absolute;inset:0;opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
.stage .fig.on{opacity:1;transform:none;pointer-events:auto}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:auto}
.fig svg{width:100%;height:auto;max-height:420px}
.fig img{max-width:100%;max-height:420px;object-fit:contain;align-self:center}
.fig figcaption{font-size:13px;color:var(--muted);text-align:center}
.steps .step{min-height:78vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.js .steps .step .fig{display:none}
.step .kicker{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.step h2{font-size:26px;line-height:1.3;margin:6px 0 14px}
.step .plain{font-size:19px;margin:0 0 14px;white-space:pre-line}
.step details.tech{border-left:3px solid var(--line);padding:2px 0 2px 14px;color:var(--muted);font-size:15px}
.step details.tech summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none}
.step details.tech summary::before{content:"▸ "}
.step details.tech[open] summary::before{content:"▾ "}
.step details.tech p{margin:6px 0 0;white-space:pre-line}
.evidence{margin-top:12px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.evidence code,.evidence a{background:var(--code-bg);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;text-decoration:none}
body[data-mode="plain"] .step details.tech{display:none}
body[data-mode="tech"] .step .plain{display:none}
body[data-mode="tech"] .summary .plain{display:none}
body[data-mode="plain"] .summary .tech{display:none}
/* 내장 그림 부품 */
.cap{font-size:12px;font-weight:600;color:var(--muted)}
pre.code{margin:0;background:var(--code-bg);border-radius:10px;padding:14px 16px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;color:var(--ink)}
pre.code .add{background:var(--ok-soft);display:inline-block;width:100%}
pre.code .del{background:var(--ng-soft);display:inline-block;width:100%;text-decoration:line-through;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.cell{border-radius:10px;padding:14px 10px;text-align:center}
.cell b{display:block;font-size:22px}
.cell span{display:block;font-size:13px;margin-top:6px}
.cell.ok{background:var(--ok-soft);color:var(--ok)}
.cell.warn{background:var(--warn-soft);color:var(--warn)}
.cell.ng{background:var(--ng-soft);color:var(--ng)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.flow span{background:var(--accent-soft);padding:8px 14px;border-radius:10px;font-size:15px}
.flow span.hl{background:var(--accent);color:#fff}
.flow i{color:var(--muted);font-style:normal}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ba > div{border-radius:10px;padding:14px;font-size:15px}
.ba .before{background:var(--ng-soft)} .ba .after{background:var(--ok-soft)}
.ba ul{margin:6px 0 0;padding-left:18px}
table.mx{width:100%;border-collapse:collapse;font-size:15px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:center}
table.mx th{color:var(--muted);font-weight:600;font-size:13px}
table.mx td:first-child,table.mx th:first-child{text-align:left}
.ph{border:2px dashed var(--line);border-radius:10px;padding:40px 16px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:24px 0 48px;color:var(--muted);font-size:13px}
@media (max-width:860px){
  body{font-size:16px}
  .scrolly{display:block;padding-top:0}
  .stage{top:56px;height:44vh;z-index:5;background:var(--bg);padding:8px 0}
  .stage .slot{max-height:none}
  .fig{padding:12px}
  .fig svg{max-height:30vh}
  .steps .step{min-height:70vh}
  .step h2{font-size:22px}
  .step .plain{font-size:17px}
  .ba{grid-template-columns:1fr}
}
@media print{
  .bar,.stage{display:none!important}
  .scrolly{display:block}
  .js .steps .step .fig{display:flex}
  .steps .step{min-height:0;break-inside:avoid;padding:16px 0;border-bottom:1px solid var(--line)}
  .step details.tech{display:block!important}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){ .stage .fig{transition:none} }
</style>
</head>
<body data-mode="both">
<header class="hero wrap">
  <div class="badges">{{BADGES}}</div>
  <h1>{{TITLE}}</h1>
  <div class="summary">
    <p class="plain">{{SUMMARY_PLAIN}}</p>
    <p class="tech">{{SUMMARY_TECH}}</p>
  </div>
</header>
<nav class="bar" aria-label="레시피 진행">
  <div class="wrap">
    <div class="rail" id="rail"></div>
    <div class="mode" role="group" aria-label="읽기 모드">
      <button type="button" data-mode="plain" aria-pressed="false">쉬운 설명</button>
      <button type="button" data-mode="both" aria-pressed="true">둘 다</button>
      <button type="button" data-mode="tech" aria-pressed="false">기술</button>
    </div>
  </div>
</nav>
<main class="wrap scrolly">
  <div class="stage" aria-hidden="true"><div class="slot" id="slot"></div></div>
  <div class="steps">
{{STEPS}}
  </div>
</main>
<footer class="wrap">{{FOOTER}}</footer>
<script>
(function(){
  document.documentElement.classList.add('js');
  var steps = [].slice.call(document.querySelectorAll('.step'));
  var slot = document.getElementById('slot'), rail = document.getElementById('rail');
  var figs = [], links = [];
  steps.forEach(function(step){
    var clone = step.querySelector('.fig').cloneNode(true);
    slot.appendChild(clone); figs.push(clone);
    var a = document.createElement('a');
    a.href = '#' + step.id;
    a.innerHTML = step.dataset.icon + '<span class="lbl">' + step.dataset.title + '</span>';
    a.setAttribute('aria-label', step.dataset.title);
    rail.appendChild(a); links.push(a);
  });
  function activate(i){
    figs.forEach(function(f, j){ f.classList.toggle('on', j === i); });
    links.forEach(function(a, j){ a.classList.toggle('on', j === i); });
    var on = links[i];
    if (on && rail.scrollWidth > rail.clientWidth) rail.scrollLeft = on.offsetLeft - rail.clientWidth / 2 + on.clientWidth / 2;
  }
  activate(0);
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if (e.isIntersecting) activate(steps.indexOf(e.target)); });
    }, { rootMargin: '-45% 0px -45% 0px' });
    steps.forEach(function(s){ io.observe(s); });
  }
  var KEY = 'cobro-recipe:mode', buttons = document.querySelectorAll('.mode button');
  function setMode(m){
    document.body.dataset.mode = m;
    buttons.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.mode === m)); });
    try { localStorage.setItem(KEY, m); } catch (e) {}
  }
  buttons.forEach(function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode); }); });
  try { var saved = localStorage.getItem(KEY); if (saved) setMode(saved); } catch (e) {}
})();
</script>
</body>
</html>
